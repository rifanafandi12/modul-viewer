<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penampil Modul - Lembaga Kursus dan Pelatihan</title>
  <link rel="stylesheet" href="/css/style.css">

  <link rel="stylesheet" href="/css/tailwind.css">
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
    globalThis.pdfjsLib = pdfjsLib;
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/viewer.js"></script>
</head>
<body class="min-h-screen bg-bg-soft font-sans text-base leading-relaxed text-text-main flex flex-col">

  <!-- Header: Tanpa Gradient, Logo di Kiri -->
  <header class="h-16 bg-white border-b border-border-soft sticky top-0 z-10">
    <div class="mx-auto flex h-full max-w-screen-2xl items-center justify-between px-4 md:px-6">
      <div class="flex items-center gap-3">
        <!-- Ganti path logo jika perlu -->
        <a href="/">
        <img src="/img/logo-1.png" alt="Logo Lembaga Kursus dan Pelatihan" class="h-8 md:h-10 w-auto object-contain">
        </a>
      </div>
      <div class="text-sm font-medium text-text-muted hidden sm:block">
        Perpustakaan Digital
      </div>
    </div>
  </header>

  <main class="flex-1 mx-auto w-full max-w-screen-2xl px-4 md:px-6 py-6 flex flex-col gap-6 relative">

    <!-- Tampilan Daftar Modul (Katalog) -->
    <div id="katalog-section" class="flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-border-soft pb-3">
        <h1 class="text-xl md:text-2xl font-bold text-text-main flex items-center gap-2">
          <i data-lucide="library" class="h-6 w-6 text-brand-blue"></i>
          Katalog Modul
        </h1>
        <div id="module-status" class="text-sm text-text-muted" role="status"></div>
      </div>

      <!-- Grid Container -->
      <div id="module-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5"></div>
    </div>

    <!-- Tampilan Viewer PDF (Akan ditampilkan via JS saat modul diklik) -->
    <div id="viewer-section" class="hidden flex-col gap-4 w-full">
      <div class="flex items-center justify-between border-b border-border-soft pb-3">
        <div class="flex items-center gap-3 min-w-0">
          <button id="btn-back" class="p-2 rounded-full hover:bg-white border border-transparent hover:border-border-soft transition-colors text-text-muted hover:text-brand-blue" aria-label="Kembali ke katalog">
            <i data-lucide="arrow-left" class="h-5 w-5"></i>
          </button>
          <h2 id="viewer-title" class="text-lg md:text-xl font-bold text-text-main truncate">Memuat...</h2>
        </div>
        <p id="viewer-status" class="text-sm text-text-muted hidden md:block" role="status"></p>
      </div>

      <div id="viewer" class="min-h-[70vh] overflow-auto rounded-lg border border-border-soft bg-white p-4 md:p-8 relative" tabindex="0" aria-label="Area pembaca PDF">
        <div id="viewer-state" class="flex min-h-[60vh] flex-col items-center justify-center gap-2 text-center text-text-muted">
          <!-- State default -->
        </div>
        <div id="pdf-pages" class="flex flex-col items-center gap-6"></div>
      </div>
    </div>

  </main>
</body>
</html>
