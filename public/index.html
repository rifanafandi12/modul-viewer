<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penampil Modul - Lembaga Kursus dan Pelatihan</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-blue': '#1E5AA8',
            'brand-blue-dk': '#154478',
            'brand-red': '#D32F2F',
            'brand-red-lt': '#FBE9E9',
            'brand-green': '#4CAF50',
            'brand-green-lt': '#E8F5E9',
            'text-main': '#212121',
            'text-muted': '#666666',
            'border-soft': '#E0E0E0',
            'bg-soft': '#F8F9FA'
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
    globalThis.pdfjsLib = pdfjsLib;
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/viewer.js"></script>
</head>
<body class="min-h-screen bg-white font-sans text-base leading-relaxed text-text-main">
  <header class="h-16 bg-gradient-to-b from-brand-blue to-brand-blue-dk text-white">
    <div class="mx-auto flex h-full max-w-screen-2xl items-center justify-between px-4 md:px-6">
      <div class="flex items-center gap-3">
        <i data-lucide="book-open" class="h-6 w-6 shrink-0" aria-hidden="true"></i>
        <div class="leading-tight">
          <h1 class="text-lg font-semibold">Modul Pembelajaran</h1>
          <p class="hidden text-sm text-white/85 sm:block">Lembaga Kursus dan Pelatihan</p>
        </div>
      </div>
      <span class="text-sm text-white/85">Perpustakaan digital</span>
    </div>
  </header>

  <main class="mx-auto grid min-h-[calc(100vh-4rem)] max-w-screen-2xl grid-cols-1 md:grid-cols-[18rem_minmax(0,1fr)]">
    <aside class="border-b border-border-soft bg-white p-5 md:border-b-0 md:border-r md:p-6" aria-labelledby="module-heading">
      <div class="mb-4 flex items-center justify-between gap-3">
        <h2 id="module-heading" class="text-lg font-semibold">Daftar Modul</h2>
        <span id="module-count" class="rounded border border-border-soft px-2 py-0.5 text-sm text-text-muted">0</span>
      </div>
      <div id="module-status" class="mb-3 text-sm text-text-muted" role="status"></div>
      <ul id="module-list" class="flex flex-col gap-2"></ul>
    </aside>

    <section class="min-w-0 p-4 md:p-6" aria-labelledby="viewer-heading">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <h2 id="viewer-heading" class="text-lg font-semibold">Penampil Modul</h2>
        <p id="viewer-status" class="text-sm text-text-muted" role="status"></p>
      </div>
      <div id="viewer" class="min-h-[60vh] overflow-auto rounded-lg border border-border-soft bg-bg-soft p-4 md:p-6" tabindex="0" aria-label="Area pembaca PDF">
        <div id="viewer-state" class="flex min-h-[55vh] flex-col items-center justify-center gap-2 text-center text-text-muted">
          <i data-lucide="folder-open" class="h-10 w-10" aria-hidden="true"></i>
          <p class="font-medium">Belum ada modul yang dibuka.</p>
          <p class="text-sm">Pilih modul dari daftar untuk mulai membaca.</p>
        </div>
        <div id="pdf-pages" class="flex flex-col items-center gap-6"></div>
      </div>
    </section>
  </main>
</body>
</html>
