<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin - Lembaga Kursus dan Pelatihan</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-bg-soft font-sans text-base leading-relaxed text-text-main flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-lg border border-border-soft shadow-sm p-6 md:p-8">

    <!-- Logo Brand -->
    <div class="flex justify-center mb-6">
      <img src="/img/logo-1.png" alt="Logo Lembaga Kursus dan Pelatihan" class="h-12 w-auto object-contain">
    </div>

    <h1 class="text-xl font-bold text-center mb-6">Masuk ke Portal Admin</h1>

    <!-- Form Login -->
    <form id="login-form" class="flex flex-col gap-4">
      <div>
        <label for="username" class="block text-sm font-medium text-text-main mb-1">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username"
               class="w-full rounded border border-border-soft px-3 py-2 text-sm focus:border-brand-blue focus:outline-none focus:ring-1 focus:ring-brand-blue transition-colors">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-text-main mb-1">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               class="w-full rounded border border-border-soft px-3 py-2 text-sm focus:border-brand-blue focus:outline-none focus:ring-1 focus:ring-brand-blue transition-colors">
      </div>

      <!-- Pesan Error -->
      <div id="login-error" class="hidden text-sm text-brand-red bg-brand-red-lt p-2 rounded text-center"></div>

      <button type="submit" id="btn-submit"
              class="mt-2 w-full rounded bg-brand-blue px-4 py-2 text-sm font-semibold text-white hover:bg-brand-blue-dk focus:outline-none focus:ring-2 focus:ring-brand-blue focus:ring-offset-2 transition-colors disabled:opacity-70">
        Masuk
      </button>
    </form>

  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('login-error');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.add('hidden');
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Memproses...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin'
        });

        if (res.ok) {
          window.location.href = '/admin/';
        } else {
          const data = await res.json().catch(() => ({}));
          errorDiv.textContent = data.error || 'Username atau password salah.';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = 'Terjadi kesalahan jaringan. Coba lagi.';
        errorDiv.classList.remove('hidden');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Masuk';
      }
    });

    // Inisialisasi ikon jika ada (Lucide)
    if (globalThis.lucide) globalThis.lucide.createIcons();
  </script>
</body>
</html>
